<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DELIVERY TO HOME</title>

<meta name="theme-color" content="#1769AA">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  color:#222;

  /* अपनी image का नाम background.jpg रखें */
  background:
    linear-gradient(rgba(255,255,255,.82),rgba(255,255,255,.82)),
    url("./background.jpg");

  background-size:cover;
  background-position:center;
  background-attachment:fixed;
}

header{
  background:rgba(23,105,170,.95);
  color:white;
  text-align:center;
  padding:18px;
  position:sticky;
  top:0;
  z-index:10;
  box-shadow:0 2px 10px #777;
}

header h1{
  margin:0;
  font-size:26px;
}

.container{
  max-width:950px;
  margin:auto;
  padding:12px;
}

.card{
  background:rgba(255,255,255,.96);
  padding:16px;
  margin:12px 0;
  border-radius:14px;
  box-shadow:0 3px 12px rgba(0,0,0,.18);
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.stat{
  text-align:center;
  padding:15px;
  background:rgba(255,255,255,.97);
  border-radius:12px;
  box-shadow:0 2px 8px #ccc;
}

.stat b{
  display:block;
  font-size:21px;
  margin-top:5px;
}

.summary{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.summary div{
  background:#f1f3f5;
  padding:12px;
  text-align:center;
  border-radius:8px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

label{
  display:block;
  font-weight:bold;
  margin-top:10px;
}

input,select,textarea{
  width:100%;
  padding:12px;
  margin-top:5px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
  background:white;
}

textarea{
  min-height:80px;
}

button{
  border:0;
  border-radius:8px;
  padding:11px 14px;
  margin:4px;
  cursor:pointer;
  font-size:15px;
}

.save{
  width:100%;
  background:#1769aa;
  color:white;
  font-size:17px;
  margin-top:15px;
}

.today{
  background:#1769aa;
  color:white;
}

.reset{
  background:#666;
  color:white;
}

.delivery{
  border-top:1px solid #ddd;
  padding:16px 0;
}

.delivery:first-child{
  border-top:0;
}

.badge{
  display:inline-block;
  padding:5px 8px;
  border-radius:6px;
  background:#eee;
}

.paid{
  background:#d1e7dd;
  color:#075c35;
}

.unpaid{
  background:#fff0c2;
  color:#6b5200;
}

.call{
  background:#25d366;
  color:white;
}

.map{
  background:#4285f4;
  color:white;
}

.delete{
  background:#dc3545;
  color:white;
}

.done{
  background:#198754;
  color:white;
}

.paymentBtn{
  background:#ff9800;
  color:white;
}

.error{
  background:#ffe5e5;
  color:#a00;
  padding:12px;
  border-radius:8px;
}

.success{
  background:#d1e7dd;
  color:#075c35;
  padding:12px;
  border-radius:8px;
}

.actions{
  margin-top:10px;
}

.orderImage{
  width:100%;
  max-width:280px;
  max-height:280px;
  object-fit:cover;
  border-radius:10px;
  margin-top:8px;
  border:1px solid #ddd;
}

.hidden{
  display:none;
}

.loginBox{
  max-width:450px;
  margin:60px auto;
}

.logout{
  background:#dc3545;
  color:white;
}

.userInfo{
  text-align:center;
  font-size:14px;
  margin-top:8px;
}

@media(max-width:600px){

  .grid,
  .summary{
    grid-template-columns:1fr;
  }

  header h1{
    font-size:22px;
  }

  .container{
    padding:8px;
  }

}
</style>
</head>

<body>

<!-- MAIN APP -->

<div id="appPage" class="hidden">

<div class="container">

<div style="text-align:right">
<button

>

<!-- STATS -->

<div class="stats">

💰 Total Amount

</div>

<br>

<button
 class="today"
 onclick="setToday()"
>

</button>

<button onclick="setYesterday()">
⬅️ Yesterday
</button>

<button
 class="reset"
 onclick="resetFilter()"
>
🔄 Reset
</button>

</div>


<!-- NEW DELIVERY -->

<div class="card">

<h2>➕ New Delivery</h2>


<label>Delivery Boy Name</label>

<input
 id="boy"
 placeholder="Delivery boy name"
 list="boyList"
>

<datalist id="boyList"></datalist>


<label>Customer Name</label>

<input
 id="customer"
 placeholder="Customer name"
>


<label>Customer Mobile</label>

<input
 id="mobile"
 placeholder="Mobile number"
 type="tel"
>


<label>Customer Address</label>

<textarea
 id="address"
 placeholder="Customer address"
></textarea>


<label>📷 Order Image</label>

<input
 id="orderImage"
 type="file"
 accept="image/*"
>


<label>Order Amount</label>

<input
 id="amount"
 type="number"
 placeholder="₹ Order amount"
>


<label>Customer Se Received Amount</label>

<input
 id="received"
 type="number"
 placeholder="₹ Received amount"
>


<p>
🔄 Change to Give:
<b id="change">₹0.00</b>
</p>

<p>
⚠️ Balance / Unpaid:
<b id="balance">₹0.00</b>
</p>


<label>Payment Type</label>

<select id="newType">

<option value="Cash">💵 Cash</option>

<option value="Credit">📒 Credit</option>

</select>


<label>Payment Status</label>

<select id="newPayment">

<option value="Unpaid">Unpaid</option>
<option value="Paid">Paid</option>

</select>


<label>Delivery Status</label>

<select id="newStatus">

<option value="Pending">Pending</option>

 class="save"
 onclick="saveDelivery()"
>
💾 Save Delivery
</button>

<!-- DELIVERY LIST -->

<h2>📦 Delivery List</h2>

<input
 id="search"
 placeholder="🔎 Search customer / delivery boy / mobile"
>

<div id="list">
Loading...
</div>

</div>

</div>

</div>


<script>

/* ================================
   SUPABASE
================================ */

const SUPABASE_URL =
"https://mrozcbaendyheujcmfpi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_p5tiMbyZOZR9_bcTbHuYbw_5JFSFiSF";


let accessToken = null;
let currentUser = null;
let deliveries = [];


/* ================================
   API
================================ */

async function api(path,options={}){

const headers = {

"apikey":SUPABASE_KEY,
"Content-Type":"application/json",
"Prefer":"return=representation"

};

if(accessToken){

headers["Authorization"] =
"Bearer "+accessToken;

}else{

headers["Authorization"] =
"Bearer "+SUPABASE_KEY;

}

const response =
await fetch(
SUPABASE_URL+
"/rest/v1/"+
path,
{
...options,
headers:{
...headers,
...(options.headers||{})
}
}
);

const text =
await response.text();

if(!response.ok){

throw new Error(text);

}

return text
?JSON.parse(text)
:[];

}


/* ================================
   AUTH
================================ */

async function login(){

const email =
document.getElementById("loginEmail")
.value.trim();

const password =
document.getElementById("loginPassword")
.value;

const msg =
document.getElementById("loginMessage");


if(!email || !password){

msg.innerHTML =
"<div class='error'>Please enter email and password.</div>";

return;

}


try{

const response =
await fetch(
SUPABASE_URL+
"/auth/v1/token?grant_type=password",
{
method:"POST",

headers:{
"apikey":SUPABASE_KEY,
"Content-Type":"application/json"
},

body:JSON.stringify({
email:email,
password:password
})
}
);


const data =
await response.json();


if(!response.ok){

throw new Error(
data.error_description ||
data.msg ||
"Login failed"
);

}


accessToken =
data.access_token;

currentUser =
data.user;


localStorage.setItem(
"delivery_access_token",
accessToken
);

localStorage.setItem(
"delivery_user",
JSON.stringify(currentUser)
);


showApp();

await load();

}catch(error){

msg.innerHTML =
"<div class='error'>❌ "+
escapeHTML(error.message)+
"</div>";

}

}


/* ================================
   CREATE ACCOUNT
================================ */

async function createAccount(){

const email =
document.getElementById("loginEmail")
.value.trim();

const password =
document.getElementById("loginPassword")
.value;


if(!email || !password){

document.getElementById(
"loginMessage"
).innerHTML =
"<div class='error'>Email और password भरें.</div>";

return;

}


try{

const response =
await fetch(
SUPABASE_URL+
"/auth/v1/signup",
{
method:"POST",

headers:{
"apikey":SUPABASE_KEY,
"Content-Type":"application/json"
},

body:JSON.stringify({
email:email,
password:password
})
}
);


const data =
await response.json();


if(!response.ok){

throw new Error(
data.msg ||
data.error_description ||
"Account creation failed"
);

}


document.getElementById(
"loginMessage"
).innerHTML =
"<div class='success'>✅ Account created. अगर email confirmation ON है तो पहले email confirm करें, फिर Login करें.</div>";


}catch(error){

document.getElementById(
"loginMessage"
).innerHTML =
"<div class='error'>❌ "+
escapeHTML(error.message)+
"</div>";

}

}


/* ================================
   LOGOUT
================================ */

function logout(){

localStorage.removeItem(
"delivery_access_token"
);

localStorage.removeItem(
"delivery_user"
);

accessToken=null;
currentUser=null;

document.getElementById(
"appPage"
).classList.add("hidden");

document.getElementById(
"loginPage"
).classList.remove("hidden");

}


/* ================================
   SHOW APP
================================ */

function showApp(){

document.getElementById(
"loginPage"
).classList.add("hidden");

document.getElementById(
"appPage"
).classList.remove("hidden");


document.getElementById(
"userInfo"
).textContent =
currentUser?.email || "";

}


/* ================================
   GET
================================ */

function get(id){

return document
.getElementById(id)
.value
.trim();

}


/* ================================
   MONEY
================================ */

function updateMoney(){

const amount =
Number(get("amount")) || 0;

const received =
Number(get("received")) || 0;


document.getElementById(
"change"
).textContent =
"₹"+
Math.max(
received-amount,
0
).toFixed(2);


document.getElementById(
"balance"
).textContent =
"₹"+
Math.max(
amount-received,
0
).toFixed(2);

}


document
.getElementById("amount")
.addEventListener(
"input",
updateMoney
);

document
.getElementById("received")
.addEventListener(
"input",
updateMoney
);


/* ================================
   SAVE DELIVERY
================================ */

async function saveDelivery(){

try{

const boy=get("boy");
const customer=get("customer");
const mobile=get("mobile");
const address=get("address");

const amount =
Number(get("amount")) || 0;

const received =
Number(get("received")) || 0;

const type=get("newType");
const selectedPayment=get("newPayment");
const status=get("newStatus");


if(
!boy ||
!customer ||
!address ||
amount<=0
){

alert(
"Delivery Boy, Customer, Address और Order Amount भरें."
);

return;

}


const balance =
Math.max(
amount-received,
0
);

const change =
Math.max(
received-amount,
0
);


const paymentStatus =
balance===0
?"Paid"
:selectedPayment;


/*
  IMPORTANT:
  image अभी local preview के लिए है.
  Supabase Storage जोड़ने के बाद
  यहाँ image upload किया जा सकता है.
*/

let imageUrl="";


const imageFile =
document.getElementById(
"orderImage"
).files[0];


if(imageFile){

imageUrl =
URL.createObjectURL(
imageFile
);

}


await api(
"deliveries",
{
method:"POST",

body:JSON.stringify({

delivery_boy_name:boy,
customer_name:customer,
customer_mobile:mobile,
customer_address:address,

order_amount:amount,
total_amount:amount,

received_amount:received,
change_amount:change,

payment_type:type,
payment_status:paymentStatus,

delivery_status:status,

order_image:imageUrl,

delivery_date:
new Date().toISOString(),

user_id:
currentUser.id

})

}
);


alert(
"✅ Delivery Saved Successfully"
);


[
"boy",
"customer",
"mobile",
"address",
"amount",
"received"
].forEach(
id=>{
document.getElementById(id)
.value="";
}
);


document.getElementById(
"orderImage"
).value="";


updateMoney();

await load();


}catch(error){

console.error(error);

alert(
"❌ Save Error: "+
error.message
);

}

}


/* ================================
   LOAD
================================ */

async function load(){

try{

deliveries =
await api(
"deliveries?select=*&order=delivery_date.desc"
);

show();

}catch(error){

console.error(error);

document.getElementById(
"list"
).innerHTML =
"<div class='error'>Database Error<br><br>"+
escapeHTML(error.message)+
"</div>";

}

}


/* ================================
   SHOW
================================ */

function show(){

const search =
get("search").toLowerCase();

const date=get("date");
const payment=get("payment");
const type=get("type");
const status=get("status");


const filtered =
deliveries.filter(d=>{

const text =
(
(d.customer_name||"")+" "+
(d.delivery_boy_name||"")+" "+
(d.customer_mobile||"")
).toLowerCase();


if(
search &&
!text.includes(search)
)return false;


if(date){

const x =
new Date(
d.delivery_date
);

const localDate =
x.getFullYear()+"-"+
String(
x.getMonth()+1
).padStart(2,"0")+"-"+
String(
x.getDate()
).padStart(2,"0");


if(localDate!==date)
return false;

}


if(
payment!=="All" &&
d.payment_status!==payment
)return false;


if(
type!=="All" &&
d.payment_type!==type
)return false;


if(
status!=="All" &&
d.delivery_status!==status
)return false;


return true;

});


let total=0;
let paid=0;
let unpaid=0;
let cash=0;
let online=0;
let credit=0;


filtered.forEach(d=>{

const amount =
Number(
d.total_amount ||
d.order_amount ||
0
);


total+=amount;


if(
d.payment_status==="Paid"
){

paid+=amount;

}else{

unpaid+=amount;

}


if(
d.payment_type==="Cash"
)cash+=amount;

if(
d.payment_type==="Online"
)online+=amount;

if(
d.payment_type==="Credit"
)credit+=amount;

});


document.getElementById(
"count"
).textContent =
filtered.length;

document.getElementById(
"total"
).textContent =
"₹"+total.toFixed(2);

document.getElementById(
"paid"
).textContent =
"₹"+paid.toFixed(2);

document.getElementById(
"unpaid"
).textContent =
"₹"+unpaid.toFixed(2);

document.getElementById(
"cash"
).textContent =
"₹"+cash.toFixed(2);

document.getElementById(
"online"
).textContent =
"₹"+online.toFixed(2);

document.getElementById(
"credit"
).textContent =
"₹"+credit.toFixed(2);


if(!filtered.length){

document.getElementById(
"list"
).innerHTML =
"<p style='text-align:center'>📦 No deliveries found</p>";

return;

}


document.getElementById(
"list"
).innerHTML =

filtered.map(d=>{

const amount =
Number(
d.total_amount ||
d.order_amount ||
0
);

const received =
Number(
d.received_amount ||
0
);

const balance =
Math.max(
amount-received,
0
);

const date =
d.delivery_date
?
new Date(
d.delivery_date
).toLocaleString(
"en-IN"
)
:"-";


return `

<div class="delivery">

<h3>
👤
${escapeHTML(
d.customer_name
)}
</h3>


<p>
👨‍✈️ Delivery Boy:
<b>
${escapeHTML(
d.delivery_boy_name
)}
</b>
</p>


<p>
📞
${escapeHTML(
d.customer_mobile||"-"
)}
</p>


<p>
📍
${escapeHTML(
d.customer_address||"-"
)}
</p>


${
d.order_image
?
`
<img
class="orderImage"
src="${escapeHTML(
d.order_image
)}"
>
`
:""
}


<p>
📅 ${date}
</p>


<p>
💰 Order Amount:
<b>
₹${amount.toFixed(2)}
</b>
</p>


<p>
💵 Received:
<b>
₹${received.toFixed(2)}
</b>
</p>


<p>
🔄 Change:
<b>
₹${Number(
d.change_amount||0
).toFixed(2)}
</b>
</p>


<p>
⚠️ Balance:
<b>
₹${balance.toFixed(2)}
</b>
</p>


<p>
💳 Payment Status:

<span class="badge ${
d.payment_status==="Paid"
?"paid"
:"unpaid"
}">

${escapeHTML(
d.payment_status||"Unpaid"
)}

</span>

</p>


<p>
💰 Payment Type:
<b>
${escapeHTML(
d.payment_type||"Cash"
)}
</b>
</p>


<p>
🚚 Delivery Status:
<b>
${escapeHTML(
d.delivery_status||"Pending"
)}
</b>
</p>


<div class="actions">


<button
class="call"
onclick="callCustomer(
'${escapeJS(
d.customer_mobile||""
)}'
)"
>
📞 Call
</button>


<button
class="map"
onclick="openMap(
'${escapeJS(
d.customer_address||""
)}'
)"
>
📍 Map
</button>


${
d.payment_status!=="Paid"
?
`
<button
class="paymentBtn"
onclick="markPaid(
'${escapeJS(d.id)}'
)"
>
💳 Paid
</button>
`
:""
}


${
d.delivery_status!=="Delivered"
?
`
<button
class="done"
onclick="markDelivered(
'${escapeJS(d.id)}'
)"
>
✅ Delivered
</button>
`
:""
}


<button
class="delete"
onclick="deleteDelivery(
'${escapeJS(d.id)}'
)"
>
🗑 Delete
</button>


</div>

</div>

`;

}).join("");

}


/* ================================
   MARK PAID
================================ */

async function markPaid(id){

const type =
prompt(
"Payment Type लिखें: Cash / Online / Credit",
"Cash"
);


if(!type)return;


const cleanType =
type.trim();


if(
!["Cash","Online","Credit"]
.includes(cleanType)
){

alert(
"केवल Cash, Online या Credit लिखें."
);

return;

}


try{

await api(
"deliveries?id=eq."+
encodeURIComponent(id),
{
method:"PATCH",

body:JSON.stringify({

payment_status:"Paid",

payment_type:
cleanType

})

}
);


alert(
"✅ Payment Paid Marked"
);

await load();


}catch(error){

alert(
"❌ "+
error.message
);

}

}


/* ================================
   MARK DELIVERED
================================ */

async function markDelivered(id){

try{

await api(
"deliveries?id=eq."+
encodeURIComponent(id),
{
method:"PATCH",

body:JSON.stringify({

delivery_status:
"Delivered"

})

}
);


await load();


}catch(error){

alert(
"❌ "+
error.message
);

}

}


/* ================================
   DELETE
================================ */

async function deleteDelivery(id){

if(
!confirm(
"क्या आप यह delivery delete करना चाहते हैं?"
)
){

return;

}


try{

await api(
"deliveries?id=eq."+
encodeURIComponent(id),
{
method:"DELETE"
}
);


await load();


}catch(error){

alert(
"❌ Delete Error: "+
error.message
);

}

}

/* ================================
   FILTER
================================ */

function setToday(){

const d=new Date();

document.getElementById(
"date"
).value =
d.getFullYear()+"-"+
String(
d.getMonth()+1
).padStart(2,"0")+"-"+
String(
d.getDate()
).padStart(2,"0");

show();

}


function setYesterday(){

const d=new Date();

d.setDate(
d.getDate()-1
);

document.getElementById(
"date"
).value =
d.getFullYear()+"-"+
String(
d.getMonth()+1
).padStart(2,"0")+"-"+
String(
d.getDate()
).padStart(2,"0");

show();

}


function resetFilter(){

document.getElementById(
"date"
).value="";

document.getElementById(
"payment"
).value="All";

document.getElementById(
"type"
).value="All";

document.getElementById(
"status"

document.getElementById(
"search"

show();

}

[

/* ================================
   ESCAPE
================================ */

function escapeHTML(value){

return String(value||"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function escapeJS(value){

return String(value||"")
.replace(/\\/g,"\\\\")
.replace(/'/g,"\\'")
.replace(/\n/g," ");

}


/* ================================
   AUTO LOGIN
================================ */

async function autoLogin(){

const token =
localStorage.getItem(
"delivery_access_token"
);

const user =
localStorage.getItem(
"delivery_user"
);


if(
token &&
user
){

accessToken=token;

currentUser =
JSON.parse(user);

showApp();

await load();

}

}
