<script>

/* =====================================================
   SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
"https://mrozcbaendyheujcmfpi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_p5tiMbyZOZR9_bcTbHuYbw_5JFSFiSF";


const IMAGE_BUCKET =
"delivery-images";


let accessToken=null;
let currentUser=null;

let firms=[];
let currentFirm=null;
let deliveries=[];


/* =====================================================
   SUPABASE API
===================================================== */

async function api(path,options={}){

const headers={

"apikey":SUPABASE_KEY,

"Authorization":
"Bearer "+
(accessToken || SUPABASE_KEY),

"Content-Type":
"application/json",

"Prefer":
"return=representation"

};


const response=await fetch(

SUPABASE_URL+
"/rest/v1/"+
path,

{
...options,
headers
}

);


const text=await response.text();


if(!response.ok){

throw new Error(text);

}


return text
?JSON.parse(text)
:[];

}


/* =====================================================
   SIGN UP
===================================================== */

async function signup(){

const email=
document.getElementById("email")
.value.trim();

const password=
document.getElementById("password")
.value;


if(!email || !password){

showAuth(
"Email और Password भरें",
"error"
);

return;

}


if(password.length<6){

showAuth(
"Password कम से कम 6 characters का होना चाहिए",
"error"
);

return;

}


try{


const response=await fetch(

SUPABASE_URL+
"/auth/v1/signup",

{

method:"POST",

headers:{

"apikey":
SUPABASE_KEY,

"Content-Type":
"application/json"

},

body:JSON.stringify({

email:email,

password:password

})

}

);


const data=
await response.json();


if(!response.ok){

throw new Error(
data.msg ||
data.message ||
data.error_description ||
"Account creation failed"
);

}


if(data.access_token){

accessToken=
data.access_token;

currentUser=
data.user;

saveSession();

showApp();

}else{

showAuth(

"✅ Account created. अपने email में confirmation link खोलें, फिर Login करें.",

"success"

);

}


}catch(error){

showAuth(
"❌ "+error.message,
"error"
);

}

}


/* =====================================================
   LOGIN
===================================================== */

async function login(){

const email=
document.getElementById("email")
.value.trim();

const password=
document.getElementById("password")
.value;


if(!email || !password){

showAuth(
"Email और Password भरें",
"error"
);

return;

}


try{


const response=await fetch(

SUPABASE_URL+
"/auth/v1/token?grant_type=password",

{

method:"POST",

headers:{

"apikey":
SUPABASE_KEY,

"Content-Type":
"application/json"

},

body:JSON.stringify({

email:email,

password:password

})

}

);


const data=
await response.json();


if(!response.ok){

throw new Error(

data.error_description ||
data.msg ||
data.message ||
"Login failed"

);

}


accessToken=
data.access_token;

currentUser=
data.user;


saveSession();

showApp();


}catch(error){

showAuth(
"❌ "+error.message,
"error"
);

}

}


/* =====================================================
   FORGOT PASSWORD
===================================================== */

async function resetPassword(){

const email=
document.getElementById("email")
.value.trim();


if(!email){

showAuth(
"पहले अपना email डालें",
"error"
);

return;

}


try{


const response=await fetch(

SUPABASE_URL+
"/auth/v1/recover",

{

method:"POST",

headers:{

"apikey":
SUPABASE_KEY,

"Content-Type":
"application/json"

},

body:JSON.stringify({

email:email,

redirect_to:
window.location.href

})

}

);


if(!response.ok){

const data=
await response.json();

throw new Error(
data.msg ||
data.message ||
"Password reset failed"
);

}


showAuth(
"✅ Password reset email भेज दिया गया है.",
"success"
);


}catch(error){

showAuth(
"❌ "+error.message,
"error"
);

}

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

try{

if(accessToken){

await fetch(

SUPABASE_URL+
"/auth/v1/logout",

{

method:"POST",

headers:{

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer "+accessToken

}

}

);

}

}catch(e){}


localStorage.removeItem(
"delivery_access_token"
);

localStorage.removeItem(
"delivery_user"
);

accessToken=null;
currentUser=null;
currentFirm=null;

document
.getElementById("app")
.classList.add("hidden");

document
.getElementById("loginPage")
.classList.remove("hidden");

}


/* =====================================================
   SESSION
===================================================== */

function saveSession(){

localStorage.setItem(
"delivery_access_token",
accessToken
);

localStorage.setItem(
"delivery_user",
JSON.stringify(currentUser)
);

}


async function restoreSession(){

const token=
localStorage.getItem(
"delivery_access_token"
);

const user=
localStorage.getItem(
"delivery_user"
);


if(!token || !user){

return;

}


try{

accessToken=token;

currentUser=
JSON.parse(user);


const response=await fetch(

SUPABASE_URL+
"/auth/v1/user",

{

headers:{

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer "+accessToken

}

});


if(!response.ok){

throw new Error("Session expired");

}


currentUser=
await response.json();

saveSession();

showApp();


}catch(e){

localStorage.removeItem(
"delivery_access_token"
);

localStorage.removeItem(
"delivery_user"
);

}

}


/* =====================================================
   SHOW APP
===================================================== */

function showApp(){

document
.getElementById("loginPage")
.classList.add("hidden");

document
.getElementById("app")
.classList.remove("hidden");


document
.getElementById("loggedEmail")
.textContent=
currentUser?.email || "";


document
.getElementById("userEmail")
.textContent=
currentUser?.email || "";


loadFirms();

}


/* =====================================================
   MESSAGE
===================================================== */

function showAuth(text,type){

const box=
document.getElementById(
"authMessage"
);

box.className=
type==="error"
?"error"
:"success";

box.innerHTML=text;

}


/* =====================================================
   FIRMS
===================================================== */

async function loadFirms(){

try{


firms=await api(
"firms?select=*&order=created_at.asc"
);


const select=
document.getElementById(
"firmSelect"
);


select.innerHTML=
'<option value="">Select Firm</option>';


firms.forEach(f=>{

const option=
document.createElement("option");

option.value=f.id;

option.textContent=f.name;

select.appendChild(option);

});


/*
 Automatically select first firm
*/

if(firms.length>0){

select.value=
firms[0].id;

currentFirm=
firms[0];

document
.getElementById("mainArea")
.classList.remove("hidden");

loadDeliveries();

}


}catch(error){

alert(
"❌ Firm loading error: "+
error.message
);

}

}


/* =====================================================
   CREATE FIRM
===================================================== */

async function createFirm(){

const name=
document.getElementById(
"firmName"
).value.trim();


if(!name){

alert("Firm name डालें");

return;

}


try{


const result=
await api(

"firms",

{

method:"POST",

body:JSON.stringify({

name:name,

owner_id:
currentUser.id

})

}

);


document.getElementById(
"firmName"
).value="";


await loadFirms();


if(result[0]){

document.getElementById(
"firmSelect"
).value=
result[0].id;

currentFirm=
result[0];

document
.getElementById("mainArea")
.classList.remove("hidden");

loadDeliveries();

}


alert(
"✅ Firm created successfully"
);


}catch(error){

alert(
"❌ Firm Error: "+
error.message
);

}

}


/* =====================================================
   CHANGE FIRM
===================================================== */

function changeFirm(){

const id=
document.getElementById(
"firmSelect"
).value;


currentFirm=
firms.find(f=>f.id===id);


if(!currentFirm){

document
.getElementById("mainArea")
.classList.add("hidden");

return;

}


document
.getElementById("mainArea")
.classList.remove("hidden");


loadDeliveries();

}


/* =====================================================
   IMAGE PREVIEW
===================================================== */

function previewImage(event){

const file=
event.target.files[0];

const preview=
document.getElementById(
"imagePreview"
);


if(!file){

preview.style.display="none";

preview.src="";

return;

}


if(!file.type.startsWith("image/")){

alert("केवल image file select करें");

event.target.value="";

return;

}


if(file.size>5*1024*1024){

alert(
"Image maximum 5 MB होनी चाहिए"
);

event.target.value="";

return;

}


preview.src=
URL.createObjectURL(file);

preview.style.display="block";

}


/* =====================================================
   IMAGE UPLOAD
===================================================== */

async function uploadOrderImage(file){

if(!file || !currentUser){

return null;

}


const extension=
file.name.split(".").pop()
.toLowerCase();


const fileName=
currentUser.id+
"/"+
crypto.randomUUID()+
"."+extension;


const response=await fetch(

SUPABASE_URL+
"/storage/v1/object/"+
IMAGE_BUCKET+
"/"+
fileName,

{

method:"POST",

headers:{

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer "+accessToken,

"Content-Type":
file.type,

"x-upsert":
"false"

},

body:file

}

);


if(!response.ok){

const text=
await response.text();

throw new Error(
"Image upload failed: "+text
);

}


return (

SUPABASE_URL+
"/storage/v1/object/public/"+
IMAGE_BUCKET+
"/"+
fileName

);

}


/* =====================================================
   MONEY
===================================================== */

function updateMoney(){

const amount=
Number(
document.getElementById(
"amount"
).value
)||0;


const received=
Number(
document.getElementById(
"received"
).value
)||0;


document.getElementById(
"change"
).textContent=
"₹"+
Math.max(
received-amount,
0
).toFixed(2);


document.getElementById(
"balance"
).textContent=
"₹"+
Math.max(
amount-received,
0
).toFixed(2);

}


document
.getElementById("amount")
.addEventListener(
"input",
updateMoney
);


document
.getElementById("received")
.addEventListener(
"input",
updateMoney
);


/* =====================================================
   SAVE DELIVERY
===================================================== */

alert(
"पहले Firm select/create करें"
);

return;

}


const boy=
document.getElementById(
"boy"
).value.trim();


const customer=
document.getElementById(
"customer"
).value.trim();


const mobile=
document.getElementById(
"mobile"
).value.trim();


const address=
document.getElementById(
"address"
).value.trim();


const amount=
Number(
document.getElementById(
"amount"
).value
)||0;


const received=
Number(
document.getElementById(
"received"
).value
)||0;


const type=
document.getElementById(
"newType"
).value;


let payment=
document.getElementById(
"newPayment"
).value;


const status=
document.getElementById(
"newStatus"
).value;


const file=
document.getElementById(
"orderImage"
).files[0];


if(!customer){

alert(
"Customer Name डालें"
);

return;

}


if(!address){

alert(
"Customer Address डालें"
);

return;

}


if(amount<=0){

alert(
"Order Amount डालें"
);

return;

}


const balance=
Math.max(
amount-received,
0
);


const change=
Math.max(
received-amount,
0
);


if(balance===0){

payment="Paid";

}else{

payment="Unpaid";

}


try{


let imageUrl=null;


/*
 Upload image first
*/

if(file){

imageUrl=
await uploadOrderImage(file);

}


/*
 Save delivery
*/

await api(

"deliveries",

{

method:"POST",

body:JSON.stringify({

firm_id:
currentFirm.id,

user_id:
currentUser.id,

delivery_boy_name:
boy,

customer_name:
customer,

customer_mobile:
mobile,

customer_address:
address,

order_amount:
amount,

received_amount:
received,

change_amount:
change,

payment_type:
type,

payment_status:
payment,

delivery_status:
status,

image_url:
imageUrl

})

}

);


alert(
"✅ Delivery Saved Successfully"
);


[
"boy",
"customer",
"mobile",
"address",
"amount",
"received"
].forEach(id=>{

document.getElementById(
id
).value="";

});


document.getElementById(
"orderImage"
).value="";


document.getElementById(
"imagePreview"
).style.display="none";


document.getElementById(
"imagePreview"
).src="";


updateMoney();

loadDeliveries();


}catch(error){

alert(
"❌ Save Error: "+
error.message
);

}

}


/* =====================================================
   LOAD DELIVERIES
===================================================== */

async function loadDeliveries(){

if(!currentFirm){

return;

}


try{


deliveries=
await api(

"deliveries?select=*&firm_id=eq."+
encodeURIComponent(
currentFirm.id
)+
"&order=delivery_date.desc"

);


showDeliveries();


}catch(error){

document.getElementById(
"list"
).innerHTML=
"<div class='error'>"+
error.message+
"</div>";

}

}


/* =====================================================
   SHOW DELIVERIES
===================================================== */

function showDeliveries(){

const search=
document.getElementById(
"search"
).value.toLowerCase();


const date=
document.getElementById(
"filterDate"
).value;


const payment=
document.getElementById(
"filterPayment"
).value;


const type=
document.getElementById(
"filterType"
).value;


const status=
document.getElementById(
"filterStatus"
).value;


const filtered=
deliveries.filter(d=>{


const text=(

(d.customer_name||"")+
" "+
(d.delivery_boy_name||"")+
" "+
(d.customer_mobile||"")

).toLowerCase();


if(
search &&
!text.includes(search)
){

return false;

}


if(date){

const x=
new Date(
d.delivery_date
);


const local=

x.getFullYear()+
"-"+
String(
x.getMonth()+1
).padStart(2,"0")+
"-"+
String(
x.getDate()
).padStart(2,"0");


if(local!==date){

return false;

}

}


if(
payment!=="All" &&
d.payment_status!==payment
){

return false;

}


if(
type!=="All" &&
d.payment_type!==type
){

return false;

}


if(
status!=="All" &&
d.delivery_status!==status
){

return false;

}


return true;

});


let total=0;
let paid=0;
let unpaid=0;


filtered.forEach(d=>{

const amount=
Number(
d.order_amount
)||0;


total+=amount;


if(
d.payment_status==="Paid"
){

paid+=amount;

}else{

unpaid+=amount;

}

});


document.getElementById(
"count"
).textContent=
filtered.length;


document.getElementById(
"total"
).textContent=
"₹"+
total.toFixed(2);


document.getElementById(
"paid"
).textContent=
"₹"+
paid.toFixed(2);


document.getElementById(
"unpaid"
).textContent=
"₹"+
unpaid.toFixed(2);


if(!filtered.length){

document.getElementById(
"list"
).innerHTML=
"<p style='text-align:center'>"+
"📦 No deliveries found"+
"</p>";

return;

}


document.getElementById(
"list"
).innerHTML=


filtered.map(d=>{


const amount=
Number(
d.order_amount
)||0;


const received=
Number(
d.received_amount
)||0;


const balance=
Math.max(
amount-received,
0
);


const date=
d.delivery_date
?
new Date(
d.delivery_date
).toLocaleString(
"en-IN"
)
:"-";


let image="";


if(d.image_url){

image=`

<img
src="${esc(d.image_url)}"
class="order-image"
onclick="window.open('${js(d.image_url)}','_blank')"
>

`;

}


return `

<div class="delivery">


<h3>
👤 ${esc(d.customer_name)}
</h3>


<p>
👨‍✈️ Delivery Boy:
<b>
${esc(
d.delivery_boy_name||"-"
)}
</b>
</p>


<p>
📞 ${esc(
d.customer_mobile||"-"
)}
</p>


<p>
📍 ${esc(
d.customer_address||"-"
)}
</p>


${image}


<p>
📅 ${date}
</p>


<p>
💰 Order Amount:
<b>
₹${amount.toFixed(2)}
</b>
</p>


<p>
💵 Received:
<b>
₹${received.toFixed(2)}
</b>
</p>


<p>
⚠️ Balance:
<b>
₹${balance.toFixed(2)}
</b>
</p>


<p>
💳 Payment:
<span class="badge ${
d.payment_status==="Paid"
?"paid"
:"unpaid"
}">
${esc(
d.payment_status
)}
</span>
</p>


<p>
💰 Type:
<b>
${esc(
d.payment_type
)}
</b>
</p>


<p>
🚚 Status:
<b>
${esc(
d.delivery_status
)}
</b>
</p>


<div class="actions">


<button
class="primary"
onclick="callCustomer('${js(
d.customer_mobile||""
)}')"
>
📞 Call
</button>


<button
class="primary"
onclick="openMap('${js(
d.customer_address||""
)}')"
>
📍 Map
</button>


${
d.payment_status!=="Paid"
?
`

<button
class="green"
onclick="receivePayment('${js(d.id)}')"
>
💳 Receive Payment
</button>

`
:""
}


${
d.delivery_status!=="Delivered"
?
`

<button
class="green"
onclick="markDelivered('${js(d.id)}')"
>
✅ Delivered
</button>

`
:""
}


<button
class="red"
onclick="deleteDelivery('${js(d.id)}')"
>
🗑 Delete
</button>


</div>


</div>

`;

}).join("");

}


/* =====================================================
   RECEIVE PAYMENT
===================================================== */

async function receivePayment(id){

const delivery=
deliveries.find(
d=>d.id===id
);


if(!delivery){

return;

}


const amount=
Number(
delivery.order_amount
)||0;


const oldReceived=
Number(
delivery.received_amount
)||0;


const balance=
Math.max(
amount-oldReceived,
0
);


if(balance<=0){

alert(
"Payment already complete."
);

return;

}


const received=
prompt(
"Received payment amount:\n"+
"Remaining: ₹"+
balance.toFixed(2)
);


if(received===null){

return;

}


const paymentAmount=
Number(received);


if(
!paymentAmount ||
paymentAmount<=0
){

alert(
"Valid amount डालें"
);

return;

}


if(paymentAmount>balance){

alert(
"Amount remaining balance से ज्यादा है"
);

return;

}


const newReceived=
oldReceived+
paymentAmount;


const newBalance=
amount-
newReceived;


const paymentType=
prompt(
"Payment Type लिखें:\nCash / Online / Credit",
"Cash"
);


if(!paymentType){

return;

}


const cleanType=
paymentType.trim();


if(
!["Cash","Online","Credit"]
.includes(cleanType)
){

alert(
"Cash, Online या Credit में से चुनें"
);

return;

}


try{


await api(

"deliveries?id=eq."+
encodeURIComponent(id),

{

method:"PATCH",

body:JSON.stringify({

received_amount:
newReceived,

payment_type:
cleanType,

payment_status:
newBalance<=0
?"Paid"
:"Unpaid"

})

}

);


alert(

newBalance<=0
?
"✅ Payment complete — Paid"
:
"✅ Payment received\nRemaining: ₹"+
newBalance.toFixed(2)

);


loadDeliveries();


}catch(error){

alert(
"❌ "+error.message
);

}

}

/* =====================================================
   DELETE
===================================================== */

async function deleteDelivery(id){

if(
!confirm(
"यह delivery delete करें?"
)
){

return;

}


try{


await api(

"deliveries?id=eq."+
encodeURIComponent(id),

{

method:"DELETE"

}

);


loadDeliveries();


}catch(error){

alert(
"❌ "+error.message
);

}

}

/* =====================================================
   ESCAPE
===================================================== */

function esc(value){

return String(value||"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function js(value){

return String(value||"")
.replace(/\\/g,"\\\\")
.replace(/'/g,"\\'")
.replace(/\n/g," ");

}
