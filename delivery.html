<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLUS MEDICO Delivery</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f4f7f8;
 color:#222
}
header{
 background:#00897b;
 color:#fff;
 padding:14px 16px;
 display:flex;
 justify-content:space-between;
 align-items:center
}
header h2{margin:0;font-size:19px}
.container{max-width:1100px;margin:auto;padding:15px}
.card{
 background:#fff;
 padding:18px;
 border-radius:12px;
 margin-bottom:15px;
 box-shadow:0 2px 8px rgba(0,0,0,.08)
}
.login{
 max-width:400px;
 margin:80px auto
}
h3{color:#00897b;margin-top:0}
label{
 display:block;
 font-size:13px;
 font-weight:bold;
 margin:8px 0 5px
}
input,textarea,select{
 width:100%;
 padding:11px;
 border:1px solid #ccd4d8;
 border-radius:8px;
 font-size:15px
}
textarea{min-height:75px}
.grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px
}
.full{grid-column:1/-1}
button{
 border:0;
 border-radius:8px;
 padding:11px 14px;
 font-weight:bold;
 cursor:pointer
}
.primary{
 background:#00897b;
 color:#fff;
 width:100%;
 padding:13px
}
.logout{
 background:#fff;
 color:#00897b
}
.whatsapp{background:#25D366;color:#fff}
.edit{background:#e3f2fd;color:#1565c0}
.delete{background:#ffebee;color:#c62828}
.stats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:12px;
 margin-bottom:15px
}
.stat{
 background:#fff;
 padding:15px;
 border-radius:12px;
 box-shadow:0 2px 8px rgba(0,0,0,.07)
}
.stat small{color:#666}
.stat strong{
 display:block;
 font-size:22px;
 color:#00897b;
 margin-top:5px
}
.hidden{display:none!important}
.message{
 display:none;
 padding:10px;
 border-radius:8px;
 margin-bottom:12px
}
.success{background:#e8f5e9;color:#2e7d32}
.error{background:#ffebee;color:#c62828}
.input-wrap{position:relative}
.suggestions{
 display:none;
 position:absolute;
 left:0;
 right:0;
 top:100%;
 background:#fff;
 border:1px solid #ddd;
 border-radius:8px;
 z-index:100;
 max-height:220px;
 overflow:auto
}
.suggestion{
 padding:11px;
 border-bottom:1px solid #eee;
 cursor:pointer
}
.suggestion:hover{background:#f2f2f2}
.delivery{
 border:1px solid #ddd;
 border-radius:10px;
 padding:14px;
 margin-bottom:12px
}
.delivery-title{
 font-size:17px;
 font-weight:bold;
 color:#00897b
}
.row{font-size:14px;margin:5px 0}
.actions{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
 margin-top:10px
}
@media(max-width:700px){
 .grid{grid-template-columns:1fr}
 .full{grid-column:auto}
 .stats{grid-template-columns:1fr 1fr}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="login card">

<h2 style="text-align:center;color:#00897b">
PLUS MEDICO
</h2>

<h3>Delivery Login</h3>

<div id="loginMessage" class="message"></div>

<label>Email</label>
<input id="email" type="email" placeholder="Enter email">

<label>Password</label>
<input id="password" type="password" placeholder="Enter password">

<br>

<button class="primary" onclick="login()">
Login
</button>

</div>


<!-- APP -->
<div id="app" class="hidden">

<header>
<h2>PLUS MEDICO Delivery</h2>
<button class="logout" onclick="logout()">Logout</button>
</header>

<div class="container">

<!-- STATS -->
<div class="stats">

<div class="stat">
<small>Today's Delivery</small>
<strong id="todayCount">0</strong>
</div>

<div class="stat">
<small>Total Delivery</small>
<strong id="totalCount">0</strong>
</div>

<div class="stat">
<small>Paid</small>
<strong id="paidAmount">₹0</strong>
</div>

<div class="stat">
<small>Pending</small>
<strong id="pendingAmount">₹0</strong>
</div>

</div>


<!-- DELIVERY FORM -->
<div class="card">

<h3>➕ Add Delivery</h3>

<div id="formMessage" class="message"></div>

<div class="grid">

<!-- DELIVERY BOY -->
<div>
<label>Delivery Boy Name</label>

<div class="input-wrap">

<input
id="deliveryBoy"
placeholder="Search / enter delivery boy"
autocomplete="off"
oninput="searchBoys()">

<div id="boySuggestions" class="suggestions"></div>

</div>
</div>


<!-- CUSTOMER -->
<div>
<label>Customer Name</label>

<div class="input-wrap">

<input
id="customerName"
placeholder="Search / enter customer"
autocomplete="off"
oninput="searchCustomers()">

<div id="customerSuggestions" class="suggestions"></div>

</div>
</div>


<div>
<label>Customer Mobile</label>

<input
id="customerMobile"
type="tel"
placeholder="10 digit mobile">
</div>


<div>
<label>Order Amount</label>

<input
id="orderAmount"
type="number"
step="0.01"
value="0"
oninput="calculate()">
</div>


<div class="full">
<label>Customer Address</label>

<textarea
id="customerAddress"
placeholder="Customer address"></textarea>
</div>


<div>
<label>Received Amount</label>

<input
id="receivedAmount"
type="number"
step="0.01"
value="0"
oninput="calculate()">
</div>


<div>
<label>Pending Amount</label>

<input
id="pendingInput"
type="number"
readonly
value="0">
</div>


<div>
<label>Payment Type</label>

<select id="paymentType">
<option>Cash</option>
<option>UPI</option>
<option>Card</option>
<option>Other</option>
</select>
</div>


<div>
<label>Delivery Status</label>

<select id="deliveryStatus">
<option>Pending</option>
<option>Out for Delivery</option>
<option>Delivered</option>
<option>Cancelled</option>
</select>
</div>


<div class="full">

<button
id="saveBtn"
class="primary"
onclick="saveDelivery()">

💾 Save Delivery

</button>

</div>

</div>
</div>


<!-- SEARCH -->
<div class="card">

<h3>🔎 Search Delivery</h3>

<input
id="searchBox"
placeholder="Search customer / mobile / address / delivery boy"
oninput="renderDeliveries()">

<br><br>

<select
id="statusFilter"
onchange="renderDeliveries()">

<option value="">All Status</option>
<option>Pending</option>
<option>Out for Delivery</option>
<option>Delivered</option>
<option>Cancelled</option>

</select>

</div>


<!-- LIST -->
<div class="card">

<h3>📦 Delivery List</h3>

<div id="deliveryList">
Loading...
</div>

</div>

</div>
</div>


<script>

/* =====================================================
 SUPABASE
===================================================== */

const SUPABASE_URL =
"https://mrozcbaendyheujcmfpi.supabase.co";

/*
 IMPORTANT:
 Apna Supabase Publishable/Anon key yaha paste karo.
 Secret / Service Role key mat lagana.
*/

const SUPABASE_KEY =
"PASTE_YOUR_SUPABASE_PUBLISHABLE_OR_ANON_KEY_HERE";


const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =====================================================
 VARIABLES
===================================================== */

let currentUser=null;
let deliveries=[];
let customers=[];
let boys=[];
let editingId=null;


/* =====================================================
 START
===================================================== */

window.addEventListener("load",async()=>{

const {data,error} =
await supabaseClient.auth.getSession();

if(error){
 console.error(error);
 showLogin();
 return;
}

if(data.session){

currentUser=data.session.user;
showApp();

}else{

showLogin();

}

});


/* =====================================================
 LOGIN
===================================================== */

async function login(){

const email=
document.getElementById("email").value.trim();

const password=
document.getElementById("password").value;


if(!email || !password){

showMessage(
"loginMessage",
"Email aur password enter karein.",
"error"
);

return;

}


const {data,error} =
await supabaseClient.auth.signInWithPassword({
email:email,
password:password
});


if(error){

showMessage(
"loginMessage",
"Login failed: "+error.message,
"error"
);

console.error(error);

return;

}

currentUser=data.user;

showApp();

}


/* =====================================================
 LOGOUT
===================================================== */

async function logout(){

await supabaseClient.auth.signOut();

currentUser=null;

showLogin();

}


/* =====================================================
 SHOW LOGIN
===================================================== */

function showLogin(){

document
.getElementById("loginPage")
.classList.remove("hidden");

document
.getElementById("app")
.classList.add("hidden");

}


/* =====================================================
 SHOW APP
===================================================== */

async function showApp(){

document
.getElementById("loginPage")
.classList.add("hidden");

document
.getElementById("app")
.classList.remove("hidden");

await loadDeliveries();

}


/* =====================================================
 LOAD DELIVERIES
===================================================== */

async function loadDeliveries(){

const {data,error} =
await supabaseClient
.from("deliveries")
.select("*")
.order("created_at",{ascending:false});


if(error){

console.error(error);

showMessage(
"formMessage",
"Delivery load error: "+error.message,
"error"
);

return;

}

deliveries=data || [];

buildLists();
updateStats();
renderDeliveries();

}


/* =====================================================
 BUILD SAVED CUSTOMER / BOY LIST
===================================================== */

function buildLists(){

const customerMap=new Map();
const boyMap=new Map();


deliveries.forEach(row=>{

if(row.customer_name){

const key=
row.customer_mobile ||
row.customer_name.toLowerCase();

customerMap.set(key,{
name:row.customer_name,
mobile:row.customer_mobile || "",
address:row.customer_address || ""
});

}


if(row.delivery_boy_name){

boyMap.set(
row.delivery_boy_name.toLowerCase(),
row.delivery_boy_name
);

}

});


customers=
Array.from(customerMap.values());

boys=
Array.from(boyMap.values());

}


/* =====================================================
 CUSTOMER SEARCH
===================================================== */

function searchCustomers(){

const value=
document.getElementById("customerName")
.value
.toLowerCase()
.trim();

const box=
document.getElementById("customerSuggestions");


if(!value){

box.style.display="none";
return;

}


const result=
customers.filter(c=>
c.name.toLowerCase().includes(value) ||
c.mobile.includes(value)
).slice(0,10);


if(!result.length){

box.style.display="none";
return;

}


box.innerHTML=
result.map(c=>`

<div
class="suggestion"
onclick='selectCustomer(${JSON.stringify(c)})'>

<strong>${esc(c.name)}</strong>
<br>
<small>${esc(c.mobile)}</small>

</div>

`).join("");


box.style.display="block";

}


/* =====================================================
 SELECT CUSTOMER
===================================================== */

function selectCustomer(c){

document.getElementById("customerName").value=
c.name;

document.getElementById("customerMobile").value=
c.mobile;

document.getElementById("customerAddress").value=
c.address;

document.getElementById("customerSuggestions")
.style.display="none";

}


/* =====================================================
 BOY SEARCH
===================================================== */

function searchBoys(){

const value=
document.getElementById("deliveryBoy")
.value
.toLowerCase()
.trim();

const box=
document.getElementById("boySuggestions");


if(!value){

box.style.display="none";
return;

}


const result=
boys.filter(name=>
name.toLowerCase().includes(value)
).slice(0,10);


if(!result.length){

box.style.display="none";
return;

}


box.innerHTML=
result.map(name=>`

<div
class="suggestion"
onclick='selectBoy(${JSON.stringify(name)})'>

${esc(name)}

</div>

`).join("");


box.style.display="block";

}


/* =====================================================
 SELECT BOY
===================================================== */

function selectBoy(name){

document.getElementById("deliveryBoy").value=
name;

document.getElementById("boySuggestions")
.style.display="none";

}


/* =====================================================
 CALCULATE
===================================================== */

function calculate(){

const order=
Number(
document.getElementById("orderAmount").value
)||0;

const received=
Number(
document.getElementById("receivedAmount").value
)||0;

const pending=
Math.max(order-received,0);

document.getElementById("pendingInput")
.value=pending.toFixed(2);

}


/* =====================================================
 SAVE / UPDATE
===================================================== */

async function saveDelivery(){

if(!currentUser){

alert("Please login first.");
return;

}


const deliveryBoy=
document.getElementById("deliveryBoy")
.value.trim();

const customerName=
document.getElementById("customerName")
.value.trim();

const mobile=
document.getElementById("customerMobile")
.value.trim();

const address=
document.getElementById("customerAddress")
.value.trim();

const order=
Number(
document.getElementById("orderAmount").value
)||0;

const received=
Number(
document.getElementById("receivedAmount").value
)||0;

const paymentType=
document.getElementById("paymentType").value;

const deliveryStatus=
document.getElementById("deliveryStatus").value;


if(!deliveryBoy){
alert("Delivery Boy Name required.");
return;
}

if(!customerName){
alert("Customer Name required.");
return;
}

if(!mobile){
alert("Customer Mobile required.");
return;
}


const pending=
Math.max(order-received,0);

const now=
new Date().toISOString();


const record={

user_id:currentUser.id,

delivery_boy_name:deliveryBoy,

customer_name:customerName,

customer_mobile:mobile,

customer_address:address,

order_amount:order,

received_amount:received,

change_amount:
Math.max(received-order,0),

payment_type:paymentType,

payment_status:
pending>0 ? "Unpaid":"Paid",

delivery_status:deliveryStatus,

delivery_date:now,

total_amount:order,

last_payment_amount:received,

last_payment_type:paymentType,

payment_received_at:
received>0 ? now : null

};


let result;


if(editingId){

result=
await supabaseClient
.from("deliveries")
.update(record)
.eq("id",editingId)
.select()
.single();

}else{

result=
await supabaseClient
.from("deliveries")
.insert(record)
.select()
.single();

}


if(result.error){

console.error(result.error);

showMessage(
"formMessage",
"Save error: "+result.error.message,
"error"
);

return;

}


showMessage(
"formMessage",
editingId
?"✅ Delivery updated successfully."
:"✅ Delivery added successfully.",
"success"
);


/* WhatsApp option */

if(mobile){

const send=
confirm(
"Delivery save ho gayi.\nCustomer ko WhatsApp message bhejna hai?"
);

if(send){

const message=
deliveryMessage(
customerName,
order,
received,
pending,
deliveryStatus
);

openWhatsApp(mobile,message);

}

}


clearForm();

await loadDeliveries();

}


/* =====================================================
 DELIVERY WHATSAPP MESSAGE
===================================================== */

function deliveryMessage(
name,
order,
received,
pending,
status
){

return `Namaste ${name} ji,

PLUS MEDICO se aapki medicine delivery aa rahi hai.

Order Amount: ₹${order.toFixed(2)}
Paid Amount: ₹${received.toFixed(2)}
Pending Amount: ₹${pending.toFixed(2)}

Delivery Status: ${status}

Kripya pending amount delivery ke samay ready rakhein.

Thank you
PLUS MEDICO`;

}


/* =====================================================
 WHATSAPP
===================================================== */

function openWhatsApp(mobile,message){

let number=
String(mobile)
.replace(/\D/g,"");


if(number.length===10){
number="91"+number;
}


window.open(
"https://wa.me/"+
number+
"?text="+
encodeURIComponent(message),
"_blank"
);

}


/* =====================================================
 PENDING WHATSAPP
===================================================== */

function pendingWhatsApp(row){

const order=
Number(row.order_amount||0);

const received=
Number(row.received_amount||0);

const pending=
Math.max(order-received,0);


const message=
`Namaste ${row.customer_name||""} ji,

PLUS MEDICO payment reminder.

Order Amount: ₹${order.toFixed(2)}
Paid Amount: ₹${received.toFixed(2)}
Pending Amount: ₹${pending.toFixed(2)}

Kripya pending amount ready rakhein.

Thank you
PLUS MEDICO`;


openWhatsApp(
row.customer_mobile,
message
);

}


/* =====================================================
 EDIT DELIVERY
===================================================== */

function editDelivery(row){

editingId=row.id;


document.getElementById("deliveryBoy")
.value=row.delivery_boy_name || "";

document.getElementById("customerName")
.value=row.customer_name || "";

document.getElementById("customerMobile")
.value=row.customer_mobile || "";

document.getElementById("customerAddress")
.value=row.customer_address || "";

document.getElementById("orderAmount")
.value=row.order_amount || 0;

document.getElementById("receivedAmount")
.value=row.received_amount || 0;

document.getElementById("paymentType")
.value=row.payment_type || "Cash";

document.getElementById("deliveryStatus")
.value=row.delivery_status || "Pending";


calculate();


document.getElementById("saveBtn")
.textContent="💾 Update Delivery";


window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* =====================================================
 DELETE
===================================================== */

async function deleteDelivery(id){

if(!confirm(
"Ye delivery permanently delete karni hai?"
))return;


const {error}=
await supabaseClient
.from("deliveries")
.delete()
.eq("id",id);


if(error){

alert(
"Delete error: "+error.message
);

return;

}


await loadDeliveries();

}


/* =====================================================
 CLEAR FORM
===================================================== */

function clearForm(){

editingId=null;

document.getElementById("deliveryBoy").value="";
document.getElementById("customerName").value="";
document.getElementById("customerMobile").value="";
document.getElementById("customerAddress").value="";
document.getElementById("orderAmount").value="0";
document.getElementById("receivedAmount").value="0";
document.getElementById("pendingInput").value="0";
document.getElementById("paymentType").value="Cash";
document.getElementById("deliveryStatus").value="Pending";

document.getElementById("saveBtn")
.textContent="💾 Save Delivery";

}


/* =====================================================
 RENDER
===================================================== */

function renderDeliveries(){

const search=
document.getElementById("searchBox")
.value
.toLowerCase()
.trim();

const filter=
document.getElementById("statusFilter")
.value;


const list=
deliveries.filter(row=>{

const text=`
${row.customer_name||""}
${row.customer_mobile||""}
${row.customer_address||""}
${row.delivery_boy_name||""}
`.toLowerCase();


return
(!search || text.includes(search)) &&
(!filter || row.delivery_status===filter);

});


const box=
document.getElementById("deliveryList");


if(!list.length){

box.innerHTML="<p>No delivery found.</p>";
return;

}


box.innerHTML=
list.map(row=>{

const order=
Number(row.order_amount||0);

const received=
Number(row.received_amount||0);

const pending=
Math.max(order-received,0);


return `

<div class="delivery">

<div class="delivery-title">
${esc(row.customer_name||"Customer")}
</div>

<div class="row">
👤 Delivery Boy:
<strong>
${esc(row.delivery_boy_name||"-")}
</strong>
</div>

<div class="row">
📱 ${esc(row.customer_mobile||"-")}
</div>

<div class="row">
📍 ${esc(row.customer_address||"-")}
</div>

<div class="row">
💰 Order: ₹${order.toFixed(2)}
</div>

<div class="row">
✅ Paid: ₹${received.toFixed(2)}
</div>

<div class="row">
🔴 Pending:
<strong>₹${pending.toFixed(2)}</strong>
</div>

<div class="row">
📦 Status:
<strong>${esc(row.delivery_status||"-")}</strong>
</div>

<div class="actions">

${
pending>0
?
`
<button
class="whatsapp"
onclick='pendingWhatsApp(${JSON.stringify(row)})'>
📲 WhatsApp Pending
</button>
`
:""
}

<button
class="edit"
onclick='editDelivery(${JSON.stringify(row)})'>
✏️ Edit
</button>

<button
class="delete"
onclick="deleteDelivery('${row.id}')">
🗑 Delete
</button>

</div>

</div>

`;

}).join("");

}


/* =====================================================
 STATS
===================================================== */

function updateStats(){

const today=
new Date().toLocaleDateString(
"en-CA",
{timeZone:"Asia/Kolkata"}
);

let todayCount=0;
let paid=0;
let pending=0;


deliveries.forEach(row=>{

if(row.delivery_date){

const deliveryDay=
new Date(row.delivery_date)
.toLocaleDateString(
"en-CA",
{timeZone:"Asia/Kolkata"}
);

if(deliveryDay===today){
todayCount++;
}

}


const order=
Number(row.order_amount||0);

const received=
Number(row.received_amount||0);

paid+=received;

pending+=
Math.max(order-received,0);

});


document.getElementById("todayCount")
.textContent=todayCount;

document.getElementById("totalCount")
.textContent=deliveries.length;

document.getElementById("paidAmount")
.textContent=
"₹"+paid.toFixed(2);

document.getElementById("pendingAmount")
.textContent=
"₹"+pending.toFixed(2);

}


/* =====================================================
 MESSAGE
===================================================== */

function showMessage(id,text,type){

const el=
document.getElementById(id);

el.textContent=text;
el.className="message "+type;
el.style.display="block";

}


/* =====================================================
 ESCAPE HTML
===================================================== */

function esc(value){

return String(value||"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =====================================================
 CLOSE SEARCH SUGGESTIONS
===================================================== */

document.addEventListener("click",(e)=>{

if(!e.target.closest(
"#customerName,#customerSuggestions"
)){

document.getElementById(
"customerSuggestions"
).style.display="none";

}


if(!e.target.closest(
"#deliveryBoy,#boySuggestions"
)){

document.getElementById(
"boySuggestions"
).style.display="none";

}

});

</script>

</body>
</html>
const SUPABASE_KEY =
"PASTE_YOUR_SUPABASE_PUBLISHABLE_OR_ANON_KEY_HERE";
