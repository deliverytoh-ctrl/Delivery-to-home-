<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
color:#222;
background:
linear-gradient(rgba(255,255,255,.82),rgba(255,255,255,.82)),
url("./delivery-staff-ride-motorcycles-shopping-concept_1150-34879.jpg");

background-position:center;

header{
background:rgba(23,105,170,.96);
color:#fff;

.card{

.loginBox{

}

.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;

.stat{

border-radius:12px;

}

.stat b{
display:block;
font-size:21px;
margin-top:5px;
}

.summary{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
}

.summary div{
background:#f1f3f5;
padding:12px;
text-align:center;
border-radius:8px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

label{
display:block;
font-weight:bold;
margin-top:10px;
}

input,select,textarea{
width:100%;
padding:12px;
margin-top:5px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
background:white;
}

textarea{
min-height:80px;
}

button{
border:0;
border-radius:8px;
padding:11px 14px;
margin:4px;
cursor:pointer;
font-size:15px;
}

.save{
width:100%;
background:#1769aa;
color:white;
font-size:17px;
margin-top:15px;
}

.today{
background:#1769aa;
color:white;
}

.reset{
background:#666;
color:white;
}

.logout{
background:#dc3545;
color:white;
}

.delivery{
border-top:1px solid #ddd;
padding:16px 0;
}

.delivery:first-child{
border-top:0;
}

.badge{
display:inline-block;
padding:5px 8px;
border-radius:6px;
}

.paid{
background:#d1e7dd;
color:#075c35;
}

.unpaid{
background:#fff0c2;
color:#6b5200;
}

.call{
background:#25d366;
color:white;
}

.map{
background:#4285f4;
color:white;
}

.delete{
background:#dc3545;
color:white;
}

.done{
background:#198754;
color:white;
}

.paymentBtn{
background:#ff9800;
color:white;
}

.editBtn{
background:#6f42c1;
color:white;
}

.error{
background:#ffe5e5;
color:#a00;
padding:12px;
border-radius:8px;
}

.success{
background:#d1e7dd;
color:#075c35;
padding:12px;
border-radius:8px;
}

.orderImage{
width:100%;
max-width:300px;
max-height:300px;
object-fit:cover;
border-radius:10px;
margin-top:8px;
border:1px solid #ddd;
}

.actions{
margin-top:10px;
}

.userInfo{
font-size:13px;
margin-top:6px;
}

.loading{
text-align:center;
padding:20px;
}

@media(max-width:600px){

.grid,
.summary{
grid-template-columns:1fr;
}

.stats{
grid-template-columns:1fr 1fr;
}

header h1{
font-size:21px;
}

.container{
padding:8px;
}

}
</style>
</head>

<body>

<header>
<h1>🚚 DELIVERY TO HOME</h1>

<input

autocomplete="email"
>

<label>Password</label>
<input
type="password"
id="loginPassword"

>

<button class="save" onclick="login()">
🔐 Login
</button>

<button onclick="createAccount()">
➕ Create Account
</button>

<!-- APP -->

<div id="appPage" class="hidden">

<div class="container">

<div style="text-align:right">

<button class="logout" onclick="logout()">
🚪 Logout
</button>

<!-- STATS -->

<div class="stats">

<!-- NEW DELIVERY -->

<div class="card">

<h2>➕ New Delivery</h2>

id="boy"
placeholder="Delivery boy name"
list="boyList"
>

<input
id="customer"
placeholder="Customer name"
>


<label>Customer Mobile</label>

<input
id="mobile"
type="tel"
placeholder="Mobile number"
>


<label>Customer Address</label>

<textarea
id="address"
placeholder="Customer address"
></textarea>


<label>📷 Order Image</label>

<input
id="orderImage"
type="file"
accept="image/*"
>


<label>Order Amount</label>

<input
id="amount"
type="number"
min="0"
step="0.01"
placeholder="₹ Order amount"
>


<label>Customer Se Received Amount</label>

<input
id="received"
type="number"
min="0"
step="0.01"
placeholder="₹ Received amount"
>


<p>
🔄 Change to Give:
<b id="change">₹0.00</b>
</p>

<p>
⚠️ Balance / Unpaid:
<b id="balance">₹0.00</b>
</p>


<label>Payment Type</label>

<select id="newType">
<option value="Cash">💵 Cash</option>
<option value="Online">📱 Online</option>
<option value="Credit">📒 Credit</option>
</select>


<label>Payment Status</label>

<select id="newPayment">
<option value="Unpaid">Unpaid</option>
<option value="Paid">Paid</option>
</select>


<label>Delivery Status</label>

<select id="newStatus">
<option value="Pending">Pending</option>
<option value="Out for Delivery">Out for Delivery</option>
<option value="Delivered">Delivered</option>
<option value="Cancelled">Cancelled</option>
</select>


<button class="save" onclick="saveDelivery()">
💾 Save Delivery
</button>

</div>


<!-- DELIVERY LIST -->

<div class="card">

<h2>📦 Delivery List</h2>

<input
id="search"
placeholder="🔎 Search customer / delivery boy / mobile"
>

<div id="list" class="loading">
Loading...
</div>

</div>

</div>

</div>


<script>

/* ================================
SUPABASE
================================ */

const SUPABASE_URL =
"https://mrozcbaendyheujcmfpi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_p5tiMbyZOZR9_bcTbHuYbw_5JFSFiSF";

const STORAGE_BUCKET =
"order-images";


let accessToken=null;
let currentUser=null;
let deliveries=[];


/* ================================
AUTH HEADERS
================================ */

function authHeaders(){

return {
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+accessToken,
"Content-Type":"application/json",
"Prefer":"return=representation"
};

}


/* ================================
API
================================ */

async function api(path,options={}){

const response=await fetch(
SUPABASE_URL+"/rest/v1/"+path,
{
...options,
headers:{
...authHeaders(),
...(options.headers||{})
}
}
);

const text=await response.text();

if(!response.ok){

throw new Error(text);

}

return text?JSON.parse(text):[];

}


/* ================================
LOGIN
================================ */

async function login(){

const email=
document.getElementById("loginEmail").value.trim();

const password=
document.getElementById("loginPassword").value;

const message=
document.getElementById("loginMessage");


if(!email||!password){

message.innerHTML=
"<div class='error'>Email और password भरें.</div>";

return;

}


try{

const response=await fetch(
SUPABASE_URL+
"/auth/v1/token?grant_type=password",
{
method:"POST",
headers:{
"apikey":SUPABASE_KEY,
"Content-Type":"application/json"
},
body:JSON.stringify({
email,
password
})
}
);


const data=await response.json();


if(!response.ok){

throw new Error(
data.error_description||
data.msg||
"Login failed"
);

}


accessToken=data.access_token;
currentUser=data.user;


localStorage.setItem(
"delivery_access_token",
accessToken
);

localStorage.setItem(
"delivery_user",
JSON.stringify(currentUser)
);


showApp();

await load();


}catch(error){

message.innerHTML=
"<div class='error'>❌ "+
escapeHTML(error.message)+
"</div>";

}

}


/* ================================
CREATE ACCOUNT
================================ */

async function createAccount(){

const email=
document.getElementById("loginEmail").value.trim();

const password=
document.getElementById("loginPassword").value;

const message=
document.getElementById("loginMessage");


if(!email||!password){

message.innerHTML=
"<div class='error'>Email और password भरें.</div>";

return;

}


if(password.length<6){

message.innerHTML=
"<div class='error'>Password कम से कम 6 characters का रखें.</div>";

return;

}


try{

const response=await fetch(
SUPABASE_URL+
"/auth/v1/signup",
{
method:"POST",
headers:{
"apikey":SUPABASE_KEY,
"Content-Type":"application/json"
},
body:JSON.stringify({
email,
password
})
}
);


const data=await response.json();


if(!response.ok){

throw new Error(
data.msg||
data.error_description||
"Account creation failed"
);

}


message.innerHTML=
"<div class='success'>✅ Account created. Email confirmation ON है तो email confirm करके Login करें.</div>";


}catch(error){

message.innerHTML=
"<div class='error'>❌ "+
escapeHTML(error.message)+
"</div>";

}

}


/* ================================
LOGOUT
================================ */

function logout(){

localStorage.removeItem(
"delivery_access_token"
);

localStorage.removeItem(
"delivery_user"
);

accessToken=null;
currentUser=null;
deliveries=[];


document
.getElementById("appPage")
.classList.add("hidden");

document
.getElementById("loginPage")
.classList.remove("hidden");

}


/* ================================
SHOW APP
================================ */

function showApp(){

document
.getElementById("loginPage")
.classList.add("hidden");

document
.getElementById("appPage")
.classList.remove("hidden");

document
.getElementById("userInfo")
.textContent=
currentUser?.email||"";

}


/* ================================
VALUE
================================ */

function get(id){

return document
.getElementById(id)
.value
.trim();

}


/* ================================
MONEY
================================ */

function updateMoney(){

const amount=
Number(get("amount"))||0;

const received=
Number(get("received"))||0;


document.getElementById("change")
.textContent=
"₹"+
Math.max(
received-amount,
0
).toFixed(2);


document.getElementById("balance")
.textContent=
"₹"+
Math.max(
amount-received,
0
).toFixed(2);

}


document.getElementById("amount")
.addEventListener(
"input",
updateMoney
);

document.getElementById("received")
.addEventListener(
"input",
updateMoney
);


/* ================================
IMAGE UPLOAD
================================ */

async function uploadImage(file){

if(!file)return"";

const safeName=
file.name.replace(
/[^a-zA-Z0-9._-]/g,
"_"
);

const filePath=
currentUser.id+
"/"+
Date.now()+
"_"+safeName;


const response=await fetch(
SUPABASE_URL+
"/storage/v1/object/"+
STORAGE_BUCKET+
"/"+
filePath,
{
method:"POST",

headers:{
"Authorization":
"Bearer "+accessToken,

"apikey":
SUPABASE_KEY,

"Content-Type":
file.type||"image/jpeg"
},

body:file
}
);


if(!response.ok){

const text=
await response.text();

throw new Error(
"Image upload failed: "+text
);

}


return (
SUPABASE_URL+
"/storage/v1/object/public/"+
STORAGE_BUCKET+
"/"+
filePath
);

}


/* ================================
SAVE DELIVERY
================================ */

async function saveDelivery(){

try{

if(!currentUser){

alert("Please login first.");
return;

}


const boy=get("boy");
const customer=get("customer");
const mobile=get("mobile");
const address=get("address");

const amount=
Number(get("amount"))||0;

const received=
Number(get("received"))||0;

const type=get("newType");
const selectedPayment=get("newPayment");
const status=get("newStatus");


if(
!boy||
!customer||
!address||
amount<=0
){

alert(
"Delivery Boy, Customer, Address और Order Amount भरें."
);

return;

}


const balance=
Math.max(
amount-received,
0
);

const change=
Math.max(
received-amount,
0
);


const paymentStatus=
balance===0
?"Paid"
:selectedPayment;


const imageFile=
document
.getElementById("orderImage")
.files[0];


let imageUrl="";


if(imageFile){

imageUrl=
await uploadImage(imageFile);

}


await api(
"deliveries",
{
method:"POST",

body:JSON.stringify({

user_id:
currentUser.id,

delivery_boy_name:
boy,

customer_name:
customer,

customer_mobile:
mobile,

customer_address:
address,

order_amount:
amount,

total_amount:
amount,

received_amount:
received,

change_amount:
change,

payment_type:
type,

payment_status:
paymentStatus,

delivery_status:
status,

order_image:
imageUrl,

delivery_date:
new Date().toISOString()

})

}
);


alert("✅ Delivery Saved Successfully");


[
"boy",
"customer",
"mobile",
"address",
"amount",
"received"
].forEach(id=>{
document.getElementById(id).value="";
});


document.getElementById("orderImage").value="";

updateMoney();

await load();


}catch(error){

alert(
"❌ Save Error:\n"+
error.message
);

}

}


/* ================================
LOAD
================================ */

async function load(){

try{

if(!currentUser)return;


deliveries=
await api(
"deliveries?select=*&user_id=eq."+
encodeURIComponent(currentUser.id)+
"&order=delivery_date.desc"
);


updateBoyList();
show();


}catch(error){

console.error(error);

document.getElementById("list").innerHTML=
"<div class='error'>❌ Database Error<br><br>"+
escapeHTML(error.message)+
"</div>";

}

}


/* ================================
BOY LIST
================================ */

function updateBoyList(){

const names=[
...new Set(
deliveries
.map(d=>d.delivery_boy_name)
.filter(Boolean)
)
];


document.getElementById("boyList").innerHTML=
names.map(
name=>
`<option value="${escapeHTML(name)}"></option>`
).join("");

}


/* ================================
SHOW
================================ */

function show(){

const search=
get("search").toLowerCase();

const date=get("date");
const payment=get("payment");
const type=get("type");
const status=get("status");


const filtered=
deliveries.filter(d=>{

const text=
(
(d.customer_name||"")+
" "+
(d.delivery_boy_name||"")+
" "+
(d.customer_mobile||"")
).toLowerCase();


if(search&&!text.includes(search))
return false;


if(date){

const x=
new Date(d.delivery_date);

const localDate=
x.getFullYear()+"-"+
String(x.getMonth()+1).padStart(2,"0")+"-"+
String(x.getDate()).padStart(2,"0");


if(localDate!==date)
return false;

}


if(payment!=="All"&&
d.payment_status!==payment)
return false;


if(type!=="All"&&
d.payment_type!==type)
return false;


if(status!=="All"&&
d.delivery_status!==status)
return false;


return true;

});


let total=0;
let paid=0;
let unpaid=0;
let cash=0;
let online=0;
let credit=0;


filtered.forEach(d=>{

const amount=
Number(
d.total_amount||
d.order_amount||
0
);

total+=amount;


if(d.payment_status==="Paid")
paid+=amount;
else
unpaid+=amount;


if(d.payment_type==="Cash")
cash+=amount;

if(d.payment_type==="Online")
online+=amount;

if(d.payment_type==="Credit")
credit+=amount;

});


document.getElementById("count")
.textContent=filtered.length;

document.getElementById("total")
.textContent="₹"+total.toFixed(2);

document.getElementById("paid")
.textContent="₹"+paid.toFixed(2);

document.getElementById("unpaid")
.textContent="₹"+unpaid.toFixed(2);

document.getElementById("cash")
.textContent="₹"+cash.toFixed(2);

document.getElementById("online")
.textContent="₹"+online.toFixed(2);

document.getElementById("credit")
.textContent="₹"+credit.toFixed(2);


if(!filtered.length){

document.getElementById("list").innerHTML=
"<p style='text-align:center'>📦 No deliveries found</p>";

return;

}


document.getElementById("list").innerHTML=
filtered.map(d=>{

const amount=
Number(
d.total_amount||
d.order_amount||
0
);

const received=
Number(
d.received_amount||0
);

const balance=
Math.max(
amount-received,
0
);

const date=
d.delivery_date
?new Date(d.delivery_date)
.toLocaleString("en-IN")
:"-";


return `

<div class="delivery">

<h3>
👤 ${escapeHTML(d.customer_name)}
</h3>

<p>
👨‍✈️ Delivery Boy:
<b>
${escapeHTML(d.delivery_boy_name)}
</b>
</p>

<p>
📞 ${escapeHTML(d.customer_mobile||"-")}
</p>

<p>
📍 ${escapeHTML(d.customer_address||"-")}
</p>

${
d.order_image
?
`
<img
class="orderImage"
src="${escapeHTML(d.order_image)}"
alt="Order Image"
>
`
:""
}

<p>📅 ${date}</p>

<p>
💰 Order Amount:
<b>₹${amount.toFixed(2)}</b>
</p>

<p>
💵 Received:
<b>₹${received.toFixed(2)}</b>
</p>

<p>
🔄 Change:
<b>₹${Number(d.change_amount||0).toFixed(2)}</b>
</p>

<p>
⚠️ Balance:
<b>₹${balance.toFixed(2)}</b>
</p>

<p>
💳 Payment Status:
<span class="badge ${
d.payment_status==="Paid"
?"paid":"unpaid"
}">
${escapeHTML(d.payment_status||"Unpaid")}
</span>
</p>

<p>
💰 Payment Type:
<b>${escapeHTML(d.payment_type||"Cash")}</b>
</p>

<p>
🚚 Delivery Status:
<b>${escapeHTML(d.delivery_status||"Pending")}</b>
</p>

<div class="actions">

<button
class="call"
onclick="callCustomer('${escapeJS(d.customer_mobile||"")}')"
>
📞 Call
</button>

<button
class="map"
onclick="openMap('${escapeJS(d.customer_address||"")}')"
>
📍 Map
</button>

${
d.payment_status!=="Paid"
?
`
<button
class="paymentBtn"
onclick="markPaid('${escapeJS(d.id)}')"
>
💳 Paid
</button>
`
:""
}

${
d.payment_status==="Paid"
?
`
<button
class="editBtn"
onclick="changePayment('${escapeJS(d.id)}')"
>
✏️ Change Payment
</button>
`
:""
}

${
d.delivery_status!=="Delivered"
?
`
<button
class="done"
onclick="markDelivered('${escapeJS(d.id)}')"
>
✅ Delivered
</button>
`
:""
}

<button
class="delete"
onclick="deleteDelivery('${escapeJS(d.id)}')"
>
🗑 Delete
</button>

</div>

</div>

`;

}).join("");

}


/* ================================
PAID
================================ */

async function markPaid(id){

const type=
prompt(
"Payment Type लिखें:\nCash / Online / Credit",
"Cash"
);

if(!type)return;


const cleanType=
type.trim();


if(
!["Cash","Online","Credit"]
.includes(cleanType)
){

alert(
"केवल Cash, Online या Credit लिखें."
);

return;

}


const receivedInput=
prompt(
"Customer से कितने रुपये मिले?",
"0"
);

if(receivedInput===null)return;


const received=
Number(receivedInput);


if(
isNaN(received)||
received<0
){

alert("Valid amount डालें.");
return;

}


try{

const record=
deliveries.find(
d=>String(d.id)===String(id)
);


if(!record){

alert("Delivery नहीं मिली.");
return;

}


const amount=
Number(
record.total_amount||
record.order_amount||
0
);


const balance=
Math.max(
amount-received,
0
);

const change=
Math.max(
received-amount,
0
);


await api(
"deliveries?id=eq."+
encodeURIComponent(id),
{
method:"PATCH",

body:JSON.stringify({

received_amount:
received,

change_amount:
change,

payment_status:
balance===0
?"Paid"
:"Unpaid",

payment_type:
cleanType

})
}
);


alert(
balance===0
?"✅ Payment Paid"
:"⚠️ Partial Payment Saved"
);


await load();


}catch(error){

alert("❌ "+error.message);

}

}


/* ================================
CHANGE PAYMENT
================================ */

async function changePayment(id){

const type=
prompt(
"New Payment Type:\nCash / Online / Credit",
"Cash"
);

if(!type)return;


const cleanType=
type.trim();


if(
!["Cash","Online","Credit"]
.includes(cleanType)
){

alert(
"केवल Cash, Online या Credit."
);

return;

}


try{

await api(
"deliveries?id=eq."+
encodeURIComponent(id),
{
method:"PATCH",

body:JSON.stringify({

payment_type:
cleanType,

payment_status:
"Paid"

})
}
);


await load();


}catch(error){

alert("❌ "+error.message);

}

}

/* ================================
TODAY
================================ */

function setToday(){

const d=new Date();

document.getElementById("date").value=
d.getFullYear()+"-"+
String(d.getMonth()+1).padStart(2,"0")+"-"+
String(d.getDate()).padStart(2,"0");

show();

}


/* ================================
YESTERDAY
================================ */

function setYesterday(){

const d=new Date();

d.setDate(
d.getDate()-1
);

document.getElementById("date").value=
d.getFullYear()+"-"+
String(d.getMonth()+1).padStart(2,"0")+"-"+
String(d.getDate()).padStart(2,"0");

show();

}

/* ================================
ESCAPE
================================ */

function escapeHTML(value){

return String(value||"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function escapeJS(value){

return String(value||"")
.replace(/\\/g,"\\\\")
.replace(/'/g,"\\'")
.replace(/\n/g," ");

}
